name: Backend CI

on:
  push:
    branches: ["master", "agent/backend-hardening"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and package backend
        working-directory: backend
        env:
          JWT_SECRET: "ci-only-signing-secret-that-is-at-least-32-bytes-long"
          SPRING_PROFILES_ACTIVE: test
        run: gradle --no-daemon clean test bootJar
