spring:
  application:
    name: sip-backend

  datasource:
    # Put the full JDBC URL (including URL-encoded user/password query parameters) in DATABASE_URL.
    # Neon requires TLS, for example: jdbc:postgresql://HOST/DB?user=USER&password=PASSWORD&sslmode=require
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sipdb?user=sipuser}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY:900}
    refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY:604800}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
